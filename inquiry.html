<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Submit an enquiry to Face of Earth Covers & Blinds.">
<title>Face of Earth Covers & Blinds | Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>Face of Earth</h1>
                <p>Covers & Blinds</p>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="inquiry.html">Inquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="inquiry">
            <h2>Submit an Inquiry</h2>
            <p>Please fill out the form below to send us your inquiry. We will get back to you as soon as possible.</p>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">

                <label for="product">Product / Service:</label>
                <select id="product" name="product" required>
                    <option value="">-- Select an Option --</option>
                    <option value="blinds">Window Blinds</option>
                    <option value="roller-blinds">Roller Blinds</option>
                    <option value="outdoor-covers">Outdoor Covers</option>
                    <option value="custom">Custom Solutions</option>
                </select>

                <label for="message">Your Enquiry:</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>
